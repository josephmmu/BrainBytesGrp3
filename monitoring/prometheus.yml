global:
  scrape_interval: 5s  # Scrape every 5 seconds

scrape_configs:
  - job_name: 'brainbytes-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: [https://brainbytesgrp3-backend-production.up.railway.app/']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
