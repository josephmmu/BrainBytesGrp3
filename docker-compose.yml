version: '3'
services:
  # Frontend container
  frontend:
    build: ./frontend
    ports:
      - "5173:3000"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

  # Backend API container
  backend:
    build: ./backend
    ports:
      - "8080:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - GOOGLE_API_KEY=AIzaSyAgt4fNNyGvhD35MYjj0sMBARyqYWbQW1Q
      - MONGODB_URI=mongodb+srv://johnau:admin01@cluster0.udagqqp.mongodb.net/
      - PORT=3000
    depends_on:
      - mongo
    restart: unless-stopped

  # MongoDB container
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
