# Alertmanager Configuration for BrainBytes
global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'brainbytes-alerts@example.com'
  smtp_auth_username: 'brainbytes-alerts@example.com'
  smtp_auth_password: 'your-app-password'

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
    - match:
        severity: warning
      receiver: 'warning-alerts'
    - match:
        severity: info
      receiver: 'info-alerts'

receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://localhost:5001/alert'

  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@brainbytes.com'
        subject: '🚨 CRITICAL: BrainBytes Alert - {{ .GroupLabels.alertname }}'
        body: |
          CRITICAL ALERT for BrainBytes Application

          Alert: {{ .GroupLabels.alertname }}
          Severity: {{ .GroupLabels.severity }}
          
          {{ range .Alerts }}
          - Alert: {{ .Annotations.summary }}
          - Description: {{ .Annotations.description }}
          - Started: {{ .StartsAt }}
          {{ end }}

          Please investigate immediately!

    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts'
        title: '🚨 CRITICAL: BrainBytes Alert'
        text: |
          CRITICAL ALERT: {{ .GroupLabels.alertname }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          • {{ .Annotations.description }}
          {{ end }}

  - name: 'warning-alerts'
    email_configs:
      - to: 'team@brainbytes.com'
        subject: '⚠️ WARNING: BrainBytes Alert - {{ .GroupLabels.alertname }}'
        body: |
          WARNING ALERT for BrainBytes Application

          Alert: {{ .GroupLabels.alertname }}
          Severity: {{ .GroupLabels.severity }}
          
          {{ range .Alerts }}
          - Alert: {{ .Annotations.summary }}
          - Description: {{ .Annotations.description }}
          - Started: {{ .StartsAt }}
          {{ end }}

          Please review when possible.

  - name: 'info-alerts'
    email_configs:
      - to: 'monitoring@brainbytes.com'
        subject: 'ℹ️ INFO: BrainBytes Alert - {{ .GroupLabels.alertname }}'
        body: |
          INFO ALERT for BrainBytes Application

          Alert: {{ .GroupLabels.alertname }}
          Severity: {{ .GroupLabels.severity }}
          
          {{ range .Alerts }}
          - Alert: {{ .Annotations.summary }}
          - Description: {{ .Annotations.description }}
          - Started: {{ .StartsAt }}
          {{ end }}

          For your information.

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
